name: Bug
description: Reportar un error o comportamiento inesperado
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Descripción
      description: Qué pasó vs qué esperabas
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / evidencia
      description: Pegar logs, screenshots o stack trace si aplica
    validations:
      required: false
