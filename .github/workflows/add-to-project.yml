name: Add issue to org project

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/PlataformaIntegradaInvestigadores/projects/1
          github-token: ${{ secrets.ORG_PROJECT_TOKEN }}
