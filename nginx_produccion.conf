events {}

http {
    include /etc/nginx/mime.types;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/javascript text/xml application/xml application/xml+rss image/svg+xml font/woff font/woff2;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $host $host_allowed {
        default 0;
        centinela.epn.edu.ec 1;
    }

    server {
        listen 80;
        server_name centinela.epn.edu.ec;

        if ($host_allowed = 0) {
            return 444;
        }

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name centinela.epn.edu.ec;
        client_max_body_size 50m;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        if ($host_allowed = 0) {
            return 444;
        }

        # Única entrada API: el gateway central (resuelve el routing a los backends).
        set $api_gateway http://api-gateway:80;

        root /usr/share/nginx/html;
        index index.html;
        autoindex off;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-ugCypV+0vdZhfsFJJPpwUcqE54KBTg/rrjVD9+cVcfo='; script-src-attr 'unsafe-hashes' 'sha256-ugCypV+0vdZhfsFJJPpwUcqE54KBTg/rrjVD9+cVcfo='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' wss:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto https;

        location /api/ {
            proxy_pass $api_gateway;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /ws/ {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass $api_gateway;
        }

        location ^~ /media/profile_pictures/ {
            alias /srv/centinela/identity_media/profile_pictures/;
        }

        location ^~ /media/ {
            alias /srv/centinela/social_media/;
        }

        location ~* /\.(git|svn|hg|bzr)(/|$) {
            return 404;
        }

        location ~* (^|/)(CVS|\.DS_Store|\.env|\.env\..*|\.htpasswd|\.htaccess|\.bash_history|\.sh_history|\.mysql_history|\.psql_history|\.sqlite_history)$ {
            return 404;
        }

        location ~* \.(bak|backup|old|orig|save|swp|tmp|sql|sqlite|db)$ {
            return 404;
        }

        location ~* (^|/)(users|accounts|credentials|passwords|secrets|tokens)\.json$ {
            return 404;
        }

        location ~* \.(css|js|mjs|map|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
