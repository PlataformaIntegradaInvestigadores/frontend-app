<article
  class="candidate-card group relative flex gap-4 rounded-xl border bg-white p-4 shadow-sm transition hover:shadow-md"
  [class.border-emerald-300]="candidate.selection_reason === 'quota'"
  [class.border-gray-200]="candidate.selection_reason !== 'quota'"
  [attr.data-author-id]="candidate.author_id"
>
  <!-- Rango -->
  <div class="flex w-14 shrink-0 flex-col items-center">
    <span
      class="rank-badge flex h-11 w-11 items-center justify-center rounded-full bg-primary_tailwind text-base font-semibold text-white"
      [attr.aria-label]="'Puesto ' + candidate.rank"
    >
      {{ candidate.rank }}
    </span>
    <span
      *ngIf="fairnessEnabled"
      class="movement mt-2 inline-flex items-center gap-1 whitespace-nowrap text-[11px] font-medium"
      [class.text-emerald-600]="movement > 0"
      [class.text-rose-600]="movement < 0"
      [class.text-gray-400]="movement === 0"
      [title]="'Puesto por relevancia pura: ' + candidate.baseline_rank"
    >
      <fa-icon [icon]="movementIcon" class="text-[10px]"></fa-icon>
      {{ movementLabel }}
    </span>
  </div>

  <!-- Datos del investigador -->
  <div class="min-w-0 flex-1">
    <div class="flex items-start gap-3">
      <div
        class="avatar hidden h-10 w-10 shrink-0 items-center justify-center rounded-full bg-blue-50 text-sm font-semibold text-primary_tailwind sm:flex"
        aria-hidden="true"
      >
        {{ initials }}
      </div>
      <div class="min-w-0">
        <h3 class="candidate-name truncate text-base font-semibold text-gray-900">
          <a
            [routerLink]="['/profile', candidate.author_id]"
            class="hover:text-primary_tailwind hover:underline"
            title="Ver perfil en Centinela"
            >{{ displayName }}</a
          >
        </h3>
        <p class="candidate-institution mt-0.5 flex items-center gap-1.5 text-sm text-gray-600">
          <fa-icon [icon]="faBuildingColumns" class="text-gray-400"></fa-icon>
          <span class="truncate">{{ candidate.institution | institutionName }}</span>
        </p>
        <p class="mt-0.5 text-xs text-gray-400">Scopus ID {{ candidate.author_id }}</p>
      </div>
    </div>

    <!-- Relevancia -->
    <div class="mt-3">
      <div class="mb-1 flex items-center justify-between text-xs">
        <span class="font-medium text-gray-600">Relevancia temática</span>
        <span class="relevance-value font-semibold text-gray-800">
          {{ relevancePercent }} %
          <span class="font-normal text-gray-400"
            >· coseno {{ candidate.relevance_score | number: '1.3-3' }}</span
          >
        </span>
      </div>
      <div
        class="h-2 w-full overflow-hidden rounded-full bg-gray-100"
        role="progressbar"
        [attr.aria-valuenow]="relevancePercent"
        aria-valuemin="0"
        aria-valuemax="100"
      >
        <div
          class="relevance-bar h-full rounded-full bg-gradient-to-r from-primary_tailwind to-blue-400"
          [style.width.%]="relevancePercent"
        ></div>
      </div>
    </div>

    <!-- Badges -->
    <div *ngIf="badges.length > 0" class="mt-3 flex flex-wrap gap-2">
      <span
        *ngFor="let badge of badges"
        class="candidate-badge inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-medium ring-1 ring-inset"
        [ngClass]="badge.classes"
        [title]="badge.tooltip"
      >
        <fa-icon [icon]="badge.icon"></fa-icon>
        {{ badge.label }}
      </span>
    </div>
  </div>
</article>
