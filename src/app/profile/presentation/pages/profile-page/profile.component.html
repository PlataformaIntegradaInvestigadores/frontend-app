<!-- profile.component.html -->
<div>
  <div class="w-full">
    <app-header></app-header>
  </div>
  <div class="bg-gray-50 pt-4 -mb-2">
    <div class="mx-auto max-w-screen-xl px-4 lg:px-8">
      <button (click)="goBack()" class="w-fit inline-flex items-center text-sm font-bold text-gray-500 hover:text-red-700 transition-colors focus:outline-none">
        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Back to results
      </button>
    </div>
  </div>
  <div class="bg-gray-50">
    <app-profile-data [user]="user!" [authorCentinela]="authorCentinela" [isOwnProfile]="isOwnProfile"></app-profile-data>
  </div>
  <div class="bg-slate-200 border-y border-gray-200">
    <app-data-nav [user]="user" [isOwnProfile]="isOwnProfile"  [authorCentinela]="authorCentinela"></app-data-nav>
  </div>
  <div class="bg-gray-100">
    <div class="container mx-auto max-w-screen-xl px-3 pt-4">
      <router-outlet ></router-outlet>
    </div>
  </div>
</div>
<app-footer></app-footer>

<!-- Modal de edición de post, global y aislado -->
<app-post-editor
  *ngIf="editModalVisible && postToEdit"
  [post]="postToEdit"
  [showModal]="editModalVisible"
  (close)="closeEditModal()"
  (save)="saveEditPost($event)">
</app-post-editor>
